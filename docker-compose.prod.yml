# Local approximation of the ECS Fargate topology (infra/terraform/modules/ecs) for a
# production-config smoke test. Real deploys go through Terraform + GitHub Actions (Phase 7);
# this file is not applied directly to AWS.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on: [db, redis]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on: [backend]
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on: [backend]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run start
    env_file: [.env]
    depends_on: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  pgdata:
