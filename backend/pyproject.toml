[project]
name = "backend"
version = "0.1.0"
description = "Roadfare API — Django 5.1 + DRF"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django==5.1.*",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter<25",
    "django-storages>=1.14.6",
    "django-unfold>=0.96.0",
    "djangorestframework<3.16",
    "drf-spectacular>=0.30.0",
    "google-auth>=2.57.1",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.68.1",
    "structlog>=26.1.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# factory-boy has no type stubs — SpotFactory() etc. type as the factory class, not the
# model instance it returns at runtime. Scoped to tests/ rather than disabled globally.
module = "apps.*.tests.*"
disable_error_code = ["arg-type", "attr-defined"]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*"]
