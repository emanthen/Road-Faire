name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadfare
          POSTGRES_USER: roadfare
          POSTGRES_PASSWORD: roadfare
        ports: ["5432:5432"]
        # -h 127.0.0.1 forces a TCP probe. postgis/postgis boots a *temporary* server
        # first (to run its init scripts, incl. CREATE EXTENSION postgis) that only
        # listens on the Unix socket, then shuts it down and restarts the real one
        # listening on TCP too. Without -h, pg_isready defaults to the Unix socket and
        # reports "accepting connections" during that temporary phase — Docker marks
        # the service healthy, the job's `migrate` step connects, and the temp server
        # shuts down for the restart mid-migration. Forcing TCP means the check can't
        # pass until the real server (with postgis actually loaded) is listening.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U roadfare"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://roadfare:roadfare@localhost:5432/roadfare
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      # This job runs directly on the bare runner, not inside backend/Dockerfile's
      # image — so, unlike there, GDAL/GEOS are never installed unless a step here
      # does it. Without this, `manage.py migrate` (and anything importing
      # django.contrib.gis) fails immediately with "Could not find the GDAL library",
      # before printing a single migration line.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.25"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy apps
      - run: uv run python manage.py migrate
      - run: uv run pytest -q --cov=apps --cov-report=term-missing
      - run: uv run pytest -q apps/fees --cov=apps.fees --cov-report=term-missing --cov-fail-under=95
